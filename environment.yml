name: shaptrack
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.26.4
  - pandas=2.3.1
  - scipy=1.10.0
  - scikit-learn=1.6.1
  - statsmodels=0.14.5
  - xgboost=2.1.4
  - shap=0.48.0
  - matplotlib=3.9.2
  - pyyaml=6.0.2
  - openpyxl=3.1.5
# PLINK 2 (https://www.cog-genomics.org/plink/2.0/) is needed for the GWAS step; set gwas.plink2 in the config.
